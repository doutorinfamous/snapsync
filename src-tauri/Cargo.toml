[package]
name = "snapmaker-timelapse-syncer"
version = "0.1.0"
description = "Automatically sync Snapmaker U1 timelapses to Windows and macOS"
authors = ["Papai Nerd"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/doutorinfamous/snapsync"
homepage = "https://github.com/doutorinfamous/snapsync"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snapmaker_timelapse_syncer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1.53.1", features = ["full"] }
mdns-sd = "0.20.3"
futures-util = "0.3.33"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json"] }
base64 = "0.23.0"
percent-encoding = "2.3.2"

[dev-dependencies]
tempfile = "3.27.0"

